  <rect width="1200" height="630" fill="#f1ecdf" />
  <rect x="0" y="0" width="1200" height="14" fill="#111820" />
  <rect x="72" y="120" width="640" height="3" fill="rgba(17, 24, 32, 0.16)" />
  <text x="72" y="104" font-family="Georgia, serif" font-size="62" fill="#111820">ProofRoom</text>
  <text x="72" y="196" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#29333c">
